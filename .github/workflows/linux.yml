name: Linux native
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Native development and headless graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libimobiledevice-dev libplist-dev libusbmuxd-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth python3 binutils patchelf curl ca-certificates
      - name: Enable matching native-library source packages
        run: |
          sudo python3 scripts/enable-source-repositories.py
          sudo apt-get update
      - name: Latest stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup override set stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python3 scripts/test-native-bundle.py
      - run: python3 scripts/test-release-artifact.py
      - run: cargo build --locked --workspace --release
      - name: Native GUI smoke test (synthetic data only)
        run: |
          mkdir -p .local/gui-smoke
          xvfb-run -a -s '-screen 0 1280x960x24 -nolisten tcp' env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET LIBGL_ALWAYS_SOFTWARE=1 timeout 40s target/release/aircard-gui --smoke-dir .local/gui-smoke
          python3 scripts/check-gui-smoke.py .local/gui-smoke
      - name: Native archive
        run: ./scripts/package-native.sh --bundle-native
      - name: Relocated bundle regression test
        run: python3 scripts/check-native-bundle.py dist/*.tar.gz
      - name: Bundle startup on Arch without system device libraries
        run: |
          docker run --rm -v "$PWD/scripts:/checks:ro" -v "$PWD/dist:/dist:ro" archlinux:base bash -euc '
            pacman -Syu --noconfirm --needed python
            for package in libusbmuxd libimobiledevice libplist; do
              if pacman -Q "$package"; then
                echo "Unexpected system device library: $package" >&2
                exit 1
              fi
            done
            python /checks/check-native-bundle.py /dist/*.tar.gz
          '
      - uses: actions/upload-artifact@v4
        with:
          name: aircard-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          overwrite: true
      - name: Remove temporary UI fixtures
        if: always()
        run: rm -rf .local/gui-smoke
